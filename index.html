<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blackline Security Verwaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* Layout: schwarze Kopfleiste mit Logo und Goldlinie, links Navigation nach Kategorien, rechts Inhalt; Bearbeiten im Seitenfenster. Bewusst nur dunkel (Markenlook). */
:root{
  --bg:#0b0b0b; --surface:#141414; --raise:#1b1a18; --ink:#ece8df; --muted:#9d978b; --line:#2b2823; --field:#0e0e0e;
  --accent:#b98741; --accent-soft:#2a2116; --accent-ink:#0a0a0a; --bar:#030303;
  --good:#7ccf9c; --good-bg:#14261b; --warn:#e0b352; --warn-bg:#2f2508; --bad:#f0877d; --bad-bg:#351511; --neutral-bg:#221f1a;
  --shadow:0 12px 40px rgba(0,0,0,.7);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{background:var(--bar);border-bottom:2px solid var(--accent);padding-block:10px;padding-inline:max(16px,calc((100% - 1240px)/2 + 16px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1 1 240px}
.brand img{height:92px;width:auto;display:block;flex:none;max-width:100%}
.brand-sub{font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.bar-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.whoami{color:var(--ink);font-size:13px;text-align:right;overflow-wrap:anywhere}
.whoami b{color:var(--accent);font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on .dot{background:var(--good)}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;max-width:1240px;margin-inline:auto;padding-inline:16px;padding-block:20px 56px;align-items:start}
.menubtn{display:none}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:18px}
.cat-h{font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding:0 10px 6px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.cat-h svg{opacity:.7}
.nav-item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;border-radius:6px;padding:8px 10px;text-align:left;color:var(--ink);font-weight:500}
.nav-item:hover{background:var(--raise)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item.locked{color:var(--muted)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--neutral-bg);color:var(--muted);border-radius:99px;padding:1px 7px}
.nav-item[aria-current="page"] .count{background:var(--accent);color:var(--accent-ink)}

.notice{border:1px solid var(--line);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.notice.info{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.notice form{display:flex;gap:8px;flex-wrap:wrap;padding:0}
.notice input{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 10px;flex:1 1 180px;min-width:0;max-width:280px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar h2{font-family:var(--f-display);font-size:30px;letter-spacing:.04em;text-transform:uppercase;margin:0;flex:1 1 200px;line-height:1.1}
.toolbar input[type=search],.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input[type=search]{flex:1 1 180px;max-width:260px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:5px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--accent-ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12px}
.linkbtn:hover{color:var(--ink)}

.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;max-width:280px;overflow-wrap:anywhere}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--raise)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.main{font-weight:600}
.sub{color:var(--muted);font-size:12px}
.rk{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-right:6px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}

.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--neutral-bg);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.gold{background:var(--accent-soft);color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:4px}

.stack{display:flex;flex-direction:column;gap:12px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.post.pinned{border-color:var(--accent)}
.post-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.post h3{font-family:var(--f-display);font-size:22px;letter-spacing:.03em;margin:0;line-height:1.15;text-wrap:balance}
.post .body{white-space:pre-wrap;overflow-wrap:anywhere;max-width:70ch}
.post .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.termin{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px}
.cal{background:var(--raise);border:1px solid var(--line);border-radius:6px;text-align:center;padding:8px 4px;align-self:start}
.cal .m{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.cal .d{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.cal .w{font-size:11px;color:var(--muted)}
.rsvp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rsvp .btn.on-zu{background:var(--good);color:var(--accent-ink);border-color:var(--good)}
.rsvp .btn.on-ab{background:var(--bad);color:var(--accent-ink);border-color:var(--bad)}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;font-size:13px}
.answers div{min-width:0;overflow-wrap:anywhere}
.answers .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.k.zu{color:var(--good)} .k.ab{color:var(--bad)} .k.of{color:var(--muted)}
.past{opacity:.6}
h3.sec{font-family:var(--f-display);font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}

.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.todo input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;cursor:pointer}
.todo .t{font-weight:600;cursor:pointer;overflow-wrap:anywhere}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.todo .sub{display:flex;gap:10px;flex-wrap:wrap}
.overdue{color:var(--bad);font-weight:600}

.denied{padding:48px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
.denied strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);border-left:2px solid var(--accent);width:min(500px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.sheet h2{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1.1}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);padding:4px 8px}
#form{padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px}
.f .hint{font-weight:400;color:var(--muted);font-size:12px}
.req{color:var(--bad)}
.f input:not([type=checkbox]),.f select,.f textarea{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-weight:400;width:100%;min-width:0}
.f input:disabled,.f select:disabled,.f textarea:disabled{opacity:.6}
.f textarea{resize:vertical}
.f.check{flex-direction:row;align-items:center;gap:10px;font-weight:500}
.f.check input{width:18px;height:18px;accent-color:var(--accent)}
.group{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;background:var(--raise)}
.group-h{font-family:var(--f-display);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:400;cursor:pointer}
.chips label:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:600}
.chips input{accent-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.actions .spacer{flex:1}
.err{color:var(--bad);font-size:13px}
.meta-line{color:var(--muted);font-size:12px;padding-top:8px;border-top:1px solid var(--line)}

@media (prefers-reduced-motion:no-preference){.sheet{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .menubtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:600}
  .menubtn span.small{color:var(--muted);font-weight:400;font-size:12px}
  nav.side{position:static;display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 8px}
  nav.side.open{display:flex}
  .bar-right{align-items:flex-start}
  .whoami{text-align:left}
}
@media (max-width:520px){.brand img{height:70px}.toolbar input[type=search]{max-width:none}.termin{grid-template-columns:58px minmax(0,1fr);gap:12px}.cal .d{font-size:28px}}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.authcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:8px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.authcard img{display:block;margin:0 auto;width:220px;height:auto}
.authtabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.authtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px;color:var(--muted);font-weight:600}
.authtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
#authForm{display:flex;flex-direction:column;gap:14px;padding:0}
.authnote{color:var(--muted);font-size:12px;line-height:1.45}
.setup{max-width:640px;margin:40px auto;padding-inline:16px}
.setup code{font-family:var(--f-mono);background:var(--raise);padding:1px 6px;border-radius:4px}
.newbox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.newbox h3{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.newrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.newrow div{min-width:0;overflow-wrap:anywhere}
.count.hot{background:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile.hi{border-color:var(--accent)} .tile.hi .v{color:var(--accent)}
.lsrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.lsrow input{flex:1 1 160px;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.lsrow .rk{min-width:1.6em}
.lsrow.fixed{opacity:.7}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--ink);font-weight:600}
.iconbtn:disabled{opacity:.35;cursor:default}
.posbox{display:flex;flex-direction:column;gap:8px}
.posrow{display:grid;grid-template-columns:minmax(0,1fr) 96px 80px auto;gap:8px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px}
.posrow select{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0;width:100%}
.posrow .pos-p{text-align:right;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
@media (max-width:520px){.posrow{grid-template-columns:minmax(0,1fr) 100px}.posrow .pos-p{text-align:left}}
.calcinfo{font-size:12px;color:var(--muted);background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:-6px}
.calcinfo b{color:var(--accent)}
.info-field{background:var(--field);border:1px dashed var(--line);border-radius:6px;padding:9px 10px;font-family:var(--f-mono);font-weight:400;font-size:13px}
</style>
</head>

  P.full=r<=1;
  P.leitung=r<=2;

  P.actor=aktiv;
}

let einstMsg="";
function alertBox(m){einstMsg=m;render()}
function listAction(spec){
  if(!P.full)return;
  const [key,act,arg]=spec.split(":"),next=JSON.parse(JSON.stringify(LISTS)),arr=next[key];
  const i=key==="raenge"?arr.findIndex(r=>String(r.nr)===arg):parseInt(arg,10);
  if(i<0||i>=arr.length)return;
  if(act==="up"&&i>0){const x=arr[i];arr[i]=arr[i-1];arr[i-1]=x}
  else if(act==="down"&&i<arr.length-1){const x=arr[i];arr[i]=arr[i+1];arr[i+1]=x}
  else if(act==="del"){
    if(key==="raenge"&&data.mitarbeiter.some(m=>m.rang===arr[i].nr)){alertBox("„"+arr[i].name+"“ ist noch vergeben und kann nicht gelöscht werden.");return}
    if(arr.length<=1){alertBox("Die Liste braucht mindestens einen Eintrag.");return}
    arr.splice(i,1);
  }else return;
  einstMsg="";saveLists(next);
}
function listRename(spec,val){
  if(!P.full)return;
  const [key,arg]=spec.split(":"),v=String(val||"").trim();if(!v)return;
  const next=JSON.parse(JSON.stringify(LISTS)),arr=next[key];
  if(key==="raenge"){const r=arr.find(x=>String(x.nr)===arg);if(!r||r.name===v)return;r.name=v}
  else{const i=parseInt(arg,10);if(arr[i]===v)return;if(arr.indexOf(v)>-1){alertBox("„"+v+"“ gibt es schon.");return}arr[i]=v}
  einstMsg="";saveLists(next);
}
function listAdd(key){
  if(!P.full)return;
  const el=$("#lsnew_"+key);if(!el)return;const v=el.value.trim();if(!v)return;
  const next=JSON.parse(JSON.stringify(LISTS)),arr=next[key];
  if(key==="raenge"){if(arr.some(r=>r.name===v)){alertBox("„"+v+"“ gibt es schon.");return}arr.push({nr:Math.max(8,...arr.map(r=>r.nr))+1,name:v})}
  else{if(arr.indexOf(v)>-1){alertBox("„"+v+"“ gibt es schon.");return}arr.push(v)}
  einstMsg="";saveLists(next);
}

async function doExport(){
  if(!P.full||bk.dbusy)return;
  bk.dbusy=true;bk.dmsg="Wird erstellt…";render();
  try{
    const out={app:"blackline-verwaltung",version:1,exportedAt:new Date().toISOString(),exportedBy:me&&me.name||"",collections:{}};
    let n=0;
    for(const k of COLLS.concat(["einstellungen"])){const snap=await getDocs(collection(db,k));out.collections[k]={};snap.forEach(d=>{out.collections[k][d.id]=d.data();n++})}
    const blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="blackline-backup_"+fileStamp()+".json";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    bk.dmsg="Heruntergeladen: "+n+" Einträge.";
  }catch(e){bk.dmsg="Backup hat nicht geklappt: "+errText(e)}
  finally{bk.dbusy=false;render()}
}
async function readBackupFile(file){
  bk.err="";bk.result="";bk.progress="";bk.armed=false;
  try{
    const obj=JSON.parse(await file.text());
    if(!obj||obj.app!=="blackline-verwaltung"||!obj.collections||typeof obj.collections!=="object")throw new Error("format");
    Object.keys(obj.collections).forEach(k=>{
      if(COLLS.indexOf(k)<0&&k!=="einstellungen")throw new Error("format");
      const c=obj.collections[k];if(!c||typeof c!=="object"||Array.isArray(c))throw new Error("format");
      Object.keys(c).forEach(id=>{if(!c[id]||typeof c[id]!=="object"||Array.isArray(c[id])||!/^[A-Za-z0-9_-]{1,128}$/.test(id))throw new Error("format")});
    });
    bk.data=obj;bk.name=file.name;
  }catch(e){bk.data=null;bk.err="Diese Datei ist kein Backup dieser Verwaltung."}
  render();
}
async function doRestore(){
  if(!P.full||!bk.data||bk.busy)return;
  bk.busy=true;bk.armed=false;bk.err="";bk.progress="Aktuellen Stand lesen…";render();
  const cols=bk.data.collections,ops=[];
  try{
    for(const k of COLLS.concat(["einstellungen"])){
      if(!(k in cols))continue;
      const want=cols[k],cur=await getDocs(collection(db,k));
      cur.forEach(d=>{if(!(d.id in want)&&!(k==="mitarbeiter"&&d.id===uid))ops.push(()=>deleteDoc(doc(db,k,d.id)))});
      Object.keys(want).forEach(id=>{if(k==="mitarbeiter"&&id===uid)return;ops.push(()=>setDoc(doc(db,k,id),want[id]))});
    }
  }catch(e){bk.busy=false;bk.progress="";bk.err="Konnte den aktuellen Stand nicht lesen: "+errText(e);render();return}
  let done=0,fail=0,i=0;
  const worker=async()=>{while(i<ops.length){const op=ops[i++];try{await op()}catch(e){fail++}done++;if(done%10===0||done===ops.length){bk.progress="Eingespielt: "+done+" von "+ops.length;render()}}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  bk.busy=false;bk.progress="";
  bk.result=fail?("Fertig, aber "+fail+" von "+ops.length+" Änderungen wurden abgelehnt. Prüfe, ob die neuen Datenbank-Regeln veröffentlicht sind, und spiele das Backup erneut ein."):("Backup eingespielt: "+ops.length+" Änderungen.");
  render();
}

const shortLabel=(coll,it)=>!it?"":coll==="preise"?(it.leistung||""):(it.name||"");
const optLabel=(coll,it)=>coll==="preise"?(it.typ==="Paket"?"Paket: ":"")+(it.leistung||"")+" · "+money(it.preis)+(Number(it.inklStunden)?" für "+it.inklStunden+" Std."+(it.preisWeitere?", +"+money(it.preisWeitere)+" je weitere":""):" "+(it.einheit||"")):shortLabel(coll,it);
function refText(f,val){
  if(f.t==="multiref")return (val||[]).map(id=>{const it=byId(f.ref,canon(f.ref,id));return it?shortLabel(f.ref,it):"(unbekannt)"}).join(", ");
  if(!val)return "";const it=byId(f.ref,canon(f.ref,val));return it?shortLabel(f.ref,it):"(unbekannt)";
}
function plain(f,d){
  const v=d[f.n];
  if(f.t==="pos")return posText(d,true);
  if(f.t==="ref"||f.t==="multiref")return refText(f,v);
  if(f.t==="rank")return rankName(v);
  if(f.t==="date")return fdate(v);
  if(f.money)return money(v);
  return v==null?"":String(v);
}
function cell(f,d,ek){
  const v=f.n==="typ"&&ek==="preise"?(d.typ||"Einzelleistung"):d[f.n];
  if(f.n==="status"||f.n==="art"||f.n==="typ")return v?'<span class="pill '+(TONE[v]||"")+'">'+esc(v)+"</span>":"";
  if(f.t==="rank"){const i=rk(d),ps=rankPos(i);return ps<98?'<span class="rk">'+(ps+1)+"</span>"+esc(rankName(i)):'<span class="sub">Ohne Rang</span>'}
  if(ek==="preise"&&f.n==="preis"){const ih=Number(d.inklStunden)||0;return '<span class="mono">'+esc(money(v))+"</span>"+(ih?'<div class="sub">für '+ih+" Std."+(d.preisWeitere?" · +"+esc(money(d.preisWeitere))+" je weitere Std.":"")+"</div>":"")}
  if(ek==="sonder"&&f.n==="rabattProzent"){const pc=pctOf(d);return pc?'<span class="pill gold">−'+esc(String(pc).replace(".",","))+" %</span>":'<span class="sub">–</span>'}
  if(f.t==="pos"){const l=getPos(d);return l.length?l.map(x=>{const pr=byId("preise",x.leistung);return esc(pr?pr.leistung:"(unbekannt)")+(x.stunden?' <span class="sub">'+esc(x.stunden)+" Std.</span>":"")}).join("<br>"):'<span class="sub">–</span>'}
  if(ek==="buchungen"&&f.n==="betrag")return '<span class="mono">'+esc(money(v))+"</span>"+(d.bezahlt?'<div class="sub" style="color:var(--good)">bezahlt</div>':"");
  if(f.money)return '<span class="mono">'+esc(money(v))+"</span>";
  if(f.t==="tel")return '<span class="mono">'+esc(v||"")+"</span>";
  if(f.t==="date"){
    let t=esc(fdate(v));
    const std=ek==="buchungen"?(Math.max(0,...getPos(d).map(x=>Number(x.stunden)||0))||null):null;
    if(ek==="buchungen"&&(d.uhrzeit||std))t+='<div class="sub mono">'+(d.uhrzeit?esc(d.uhrzeit)+" Uhr":"")+(d.uhrzeit&&std?" · ":"")+(std?esc(std)+" Std.":"")+"</div>";
    return '<span class="mono">'+t+"</span>";
  }
  const txt=esc(plain(f,d));
  return f===ENT[ek].fields[0]||(ek==="sonder"&&f.n==="kunde")?'<span class="main">'+txt+"</span>":txt;
}

/* ---------- Abos je nach Recht ---------- */
function syncSubs(){
  COLLS.forEach(k=>{
    const want=!!uid&&ENT[k].read();
    if(want&&!subs[k]){
      subs[k]=onSnapshot(collection(db,k),snap=>{
        retries[k]=0;
        data[k]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
        loaded[k]=true;render();
      },()=>{
        if(subs[k]){subs[k]();subs[k]=null}
        data[k]=[];loaded[k]=true;render();
        /* abgelehnt, z. B. weil die eigene Akte gerade erst gespeichert wird: kurz warten und neu versuchen */
        if((retries[k]||0)<5){retries[k]=(retries[k]||0)+1;setTimeout(()=>{if(uid)syncSubs()},1500*retries[k])}
      });
    }else if(!want&&subs[k]){subs[k]();subs[k]=null;data[k]=[];loaded[k]=false}
  });
}

/* ---------- Sondervereinbarungen & Rabatt ---------- */
const pctOf=s=>{if(Number(s.rabattProzent))return Number(s.rabattProzent);if(!/rabatt/i.test(s.art||""))return 0;const m=String(s.wert||"").match(/(\d+(?:[.,]\d+)?)\s*%/);return m?parseFloat(m[1].replace(",",".")):0};
function kundenRabatt(kid,datum){
  const hits=data.sonder.filter(s=>s.kunde===kid&&(s.richtung||R_K)===R_K&&(s.status||"Aktiv")==="Aktiv"&&(!s.gueltigBis||!datum||s.gueltigBis>=datum))
    .map(s=>({s,p:pctOf(s)})).filter(x=>x.p>0);
  return {p:Math.min(100,hits.reduce((a,x)=>a+x.p,0)),names:hits.map(x=>(x.s.art||"Rabatt")+" "+String(x.p).replace(".",",")+" %"+(x.s.gueltigBis?" (bis "+fdate(x.s.gueltigBis)+")":""))};
}
/* Positionen einer Buchung; alte Buchungen mit nur einer Leistung werden als eine Position gelesen */
function getPos(b){
  if(Array.isArray(b.positionen))return b.positionen;
  if(!b.leistung)return [];
  const st=b.stunden!=null?b.stunden:(b.dauer?Math.ceil(num(b.dauer)||0)||null:null);
  return [{leistung:b.leistung,stunden:st}];
}
function posText(b,withHours){
  return getPos(b).map(x=>{const pr=byId("preise",x.leistung);return (pr?pr.leistung:"(unbekannt)")+(withHours&&x.stunden?" ("+x.stunden+" Std.)":"")}).join(", ");
}
function calcAll(list,auf,rab){
  const rows=list.filter(x=>x.leistung&&byId("preise",x.leistung));
  if(!rows.length)return null;
  let sum=0;const lines=[];
  rows.forEach(x=>{const pr=byId("preise",x.leistung),c=calcBetrag(pr,x.stunden,0);sum+=c.sum;lines.push(pr.leistung+": "+c.text)});
  const a=Number(auf)||0,r=Math.min(100,Math.max(0,Number(rab)||0));
  const z=a?Math.round(sum*a)/100:0,rz=r?Math.round(sum*r)/100:0;
  const total=Math.round((sum+z-rz)*100)/100;
  if(rows.length>1||a||r){
    let t=rows.length>1||(!a&&!r)?"Zwischensumme "+money(sum):money(sum);
    if(a)t+=" + "+String(a).replace(".",",")+" % Aufschlag ("+money(z)+")";
    if(r)t+=" − "+String(r).replace(".",",")+" % Rabatt ("+money(rz)+")";
    lines.push(t+" = "+money(total));
  }
  return {sum:total,lines};
}
function calcBetrag(p,std,auf){
  if(!p)return null;
  const base=Number(p.preis)||0,inkl=Number(p.inklStunden)||0,w=Number(p.preisWeitere)||0,h=Math.max(0,Number(std)||0);
  let sum=base;const parts=[];
  if(inkl>0){
    parts.push(money(base)+" für "+inkl+" Std.");
    const extra=Math.max(0,Math.ceil(h-inkl));
    if(extra>0){sum+=extra*w;parts.push(extra+" × "+money(w)+" je weitere Std.")}
  }else if(/stunde/i.test(p.einheit||"")){
    const hh=Math.max(1,Math.ceil(h||1));sum=base*hh;parts.push(hh+" Std. × "+money(base));
  }else parts.push(money(base)+" "+(p.einheit||""));
  const a=Number(auf)||0;
  if(a){const z=Math.round(sum*a)/100;parts.push(String(a).replace(".",",")+" % Aufschlag ("+money(z)+")");sum+=z}
  sum=Math.round(sum*100)/100;
  return {sum,text:parts.join(" + ")+" = "+money(sum)};
}

    const old=byId("mitarbeiter",cur.link),d=cur.d;
    if(!old){showErr("Der gewählte Eintrag existiert nicht mehr.");return}
    const merged=Object.assign({},old,body,{login:d.login,alteIds:(old.alteIds||[]).concat([old.id]),erstelltAt:d.erstelltAt||"",erstelltVon:d.erstelltVon||d.id,erstelltName:d.erstelltName||d.name||""},stamp(false));
    delete merged.id;
    if(!P.full){merged.zKontakte=false;merged.zIntern=false}
    saving=true;$("#saveBtn").disabled=true;
    try{
      const b=writeBatch(db);
      b.set(doc(db,"mitarbeiter",d.id),merged);
      b.delete(doc(db,"mitarbeiter",old.id));
      data.termine.forEach(t=>{const tl=t.teilnehmer||[];if(tl.indexOf(old.id)>-1)b.update(doc(db,"termine",t.id),{teilnehmer:tl.map(x=>x===old.id?d.id:x),["teilnehmerNamen."+d.id]:merged.name||""})});
      await b.commit();closeForm();
    }catch(e){showErr(errText(e));$("#saveBtn").disabled=false}
    finally{saving=false}
    return;
  }
  if(cur.id&&cur.ek==="mitarbeiter")body=onlyChanged(body,cur.d);
  if(cur.ek==="termine"&&body.teilnehmer){const nm={};body.teilnehmer.forEach(id=>{const m=byId("mitarbeiter",id);nm[id]=m&&m.name||""});body.teilnehmerNamen=nm}
  saving=true;$("#saveBtn").disabled=true;
  try{
    if(cur.ek==="buchungen"&&body.positionen){const pl=body.positionen;body.leistung=pl[0]?pl[0].leistung:"";const mx=Math.max(0,...pl.map(x=>Number(x.stunden)||0));body.stunden=mx||null}
    if(cur.ek==="buchungen"&&body.bezahlt&&!(cur.d&&cur.d.bezahlt))body.bezahltAm=new Date().toISOString();
    let savedId=cur.id;
    if(cur.id)await updateDoc(doc(db,cur.ek,cur.id),Object.assign(body,stamp(false)));
    else savedId=(await addDoc(collection(db,cur.ek),Object.assign(body,stamp(true)))).id;
    if(cur.ek==="buchungen"){try{await syncTermin(savedId,Object.assign({},cur.d||{},body))}catch(e){console.error(e)}}
    closeForm();
  }catch(e){showErr(errText(e));$("#saveBtn").disabled=false}
  finally{saving=false}
});

/* ---------- Klicks ---------- */
document.addEventListener("click",async ev=>{
  const t=ev.target;
  if(t.id==="closeBtn"||t.id==="cancelBtn"||t===$("#scrim")){closeForm();return}
  if(t.closest("#menuBtn")){const s=$("#side"),o=!s.classList.contains("open");s.classList.toggle("open",o);$("#menuBtn").setAttribute("aria-expanded",String(o));return}
  if(t.id==="logoutBtn"){await signOut(auth);return}
  if(t.id==="tabLogin"||t.id==="tabReg"){setAuthMode(t.id==="tabReg"?"reg":"login");return}
  if(t.id==="delBtn"){
    if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Wirklich löschen?";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="Löschen"}},4000);return}
    if(saving||!cur)return;saving=true;
    try{
      await deleteDoc(doc(db,cur.ek,cur.id));
      if(cur.ek==="buchungen"&&byId("termine","b_"+cur.id)){try{await deleteDoc(doc(db,"termine","b_"+cur.id))}catch(e){}}
      closeForm();
    }
    catch(e){showErr(errText(e))}finally{saving=false}
    return;
  }
  if(t.id==="newBtn"){openForm(tab);return}
  const nb=t.closest("[data-new]");if(nb){const q=nb.dataset.new.split(":");openForm(q[0],null,null,q[0]==="sonder"?{richtung:q[1]==="w"?R_W:R_K}:null);return}
  if(t.closest("[data-posadd]")&&cur){const box=$("#f_positionen");box.insertAdjacentHTML("beforeend",posRowHTML({leistung:"",stunden:null},""));if(cur.calc)cur.calc();box.lastElementChild.querySelector(".pos-l").focus();return}
  if(t.closest("[data-posdel]")&&cur){const box=$("#f_positionen"),row=t.closest(".posrow");if(box.children.length>1)row.remove();else{row.querySelector(".pos-l").value="";row.querySelector(".pos-h").value=""}if(cur.calc)cur.calc();return}
  if(t.id==="rabApply"&&cur&&cur.rabInfo){cur.rabInfo(true);cur.calc();return}
  if(t.id==="recalc"&&cur&&cur.calc){cur.betragManual=false;cur.calc();return}
  const ls=t.closest("[data-ls]");if(ls){listAction(ls.dataset.ls);return}
  const la=t.closest("[data-lsadd]");if(la){listAdd(la.dataset.lsadd);return}
  const pay=t.closest("[data-pay]");if(pay){togglePaid(pay.dataset.pay,pay);return}
  if(t.id==="bkDown"){doExport();return}
  if(t.id==="bkReset"){bk.data=null;bk.name="";bk.err="";bk.result="";bk.progress="";bk.armed=false;render();return}
  if(t.id==="bkRestore"){
    if(!bk.armed){bk.armed=true;render();setTimeout(()=>{if(bk.armed){bk.armed=false;render()}},5000);return}
    doRestore();return;
  }
  const rs=t.closest("[data-rsvp]");
  if(rs){
    if(!uid||!me||saving)return;
    const [id,s]=rs.dataset.rsvp.split(":");
    saving=true;rs.disabled=true;
    try{await updateDoc(doc(db,"termine",id),{["antworten."+uid]:{s,n:me.name||""}})}catch(e){rs.disabled=false}
    finally{saving=false}
    return;
  }
  const tb=t.closest("[data-tab]");
  if(tb){tab=tb.dataset.tab;query="";statusFilter="";try{localStorage.setItem("bl-tab",tab)}catch(e){}$("#side").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");render();window.scrollTo(0,0);return}
  const op=t.closest("[data-open]");
  if(op){const q=op.dataset.open.split(":");openForm(q[0],q.slice(1).join(":"))}
});
document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.lsren){listRename(t.dataset.lsren,t.value);return}
  if(t.id==="abrM"){abrMonat=t.value;render();return}
  if(t.id==="f_link"&&cur){openForm(cur.ek,cur.id,t.value||null);return}
  if(t.id==="bkFile"){if(t.files&&t.files[0])readBackupFile(t.files[0]);return}
  if(t.id==="sf"){statusFilter=t.value;render();return}
  if(t.id==="tf"){todoFilter=t.value;render();return}
  if(t.dataset&&t.dataset.toggle){
    if(!P.todo){t.checked=!t.checked;return}
    t.disabled=true;
    try{await updateDoc(doc(db,"todos",t.dataset.toggle),Object.assign({erledigt:t.checked},stamp(false)))}
    catch(e){t.checked=!t.checked;t.disabled=false}
  }
});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){query=ev.target.value;render()}});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&ev.target.id&&ev.target.id.indexOf("lsnew_")===0){ev.preventDefault();listAdd(ev.target.id.slice(6));return}if(ev.key==="Escape"&&!$("#scrim").hidden)closeForm()});

/* ---------- Anmelden & Registrieren ---------- */
let authMode="login";
function setAuthMode(m){
  authMode=m;
  $("#tabLogin").setAttribute("aria-selected",String(m==="login"));
  $("#tabReg").setAttribute("aria-selected",String(m==="reg"));
  $("#pass2Wrap").hidden=m!=="reg";
  $("#aPass2").required=m==="reg";
  $("#aPass").autocomplete=m==="reg"?"new-password":"current-password";
  $("#authBtn").textContent=m==="reg"?"Registrieren":"Anmelden";
  $("#authNote").textContent=m==="reg"?"Nur IC-Name und Passwort, keine E-Mail. Nach der Registrierung schaltet dich die Leitung frei. Merk dir dein Passwort gut: Zurücksetzen per E-Mail geht nicht.":"Noch kein Zugang? Wechsle auf „Registrieren“. Keine E-Mail nötig.";
  $("#authErr").hidden=true;
}
function authErr(m){const e=$("#authErr");e.textContent=m;e.hidden=false}
function authErrText(e){
  const c=e&&e.code||"";
  if(c==="auth/email-already-in-use")return "Dieser IC-Name ist schon vergeben.";
  if(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"||c==="auth/invalid-login-credentials")return "IC-Name oder Passwort stimmt nicht.";
  if(c==="auth/weak-password")return "Das Passwort braucht mindestens 6 Zeichen.";
  if(c==="auth/too-many-requests")return "Zu viele Versuche. Warte ein paar Minuten.";
  if(c==="auth/network-request-failed")return "Keine Verbindung. Prüfe dein Internet.";
  if(c==="auth/operation-not-allowed")return "Die Anmeldung mit Passwort ist im Firebase-Projekt noch nicht eingeschaltet.";
  return "Das hat nicht geklappt ("+c+").";
}
let pendingRegName=null,ensuring=false;
$("#authForm").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const name=$("#aName").value.trim().replace(/\s+/g," "),pw=$("#aPass").value,s=slug(name);
  if(s.replace(/\./g,"").length<2){authErr("Der IC-Name braucht mindestens zwei Buchstaben oder Ziffern.");return}
  const email=s+"@"+LOGIN_DOMAIN;
  $("#authBtn").disabled=true;
  try{
    if(authMode==="reg"){
      if(pw!==$("#aPass2").value){authErr("Die Passwörter stimmen nicht überein.");return}
      pendingRegName=name;
      const cred=await createUserWithEmailAndPassword(auth,email,pw);
      try{await updateProfile(cred.user,{displayName:name})}catch(e){}
    }else{
      await signInWithEmailAndPassword(auth,email,pw);
    }
  }catch(e){authErr(authErrText(e))}
  finally{$("#authBtn").disabled=false}
});
async function ensureOwnDoc(user){
  if(ensuring)return;ensuring=true;
  try{
    const name=pendingRegName||user.displayName||String(user.email||"").split("@")[0];
    const login=String(user.email||"").split("@")[0];
    const now=new Date().toISOString();
    const base={name,login,erstelltAt:now,erstelltVon:user.uid,erstelltName:name,geaendertAt:now,geaendertVon:user.uid,geaendertName:name};
    const setupRef=doc(db,"config","setup");
    const s=await getDoc(setupRef);
    if(!s.exists()){
      const b=writeBatch(db);
      b.set(setupRef,{by:user.uid,at:now});
      b.set(doc(db,"mitarbeiter",user.uid),Object.assign({rang:0,status:"Aktiv"},base));
      await b.commit();
    }else{
      await setDoc(doc(db,"mitarbeiter",user.uid),Object.assign({rang:99,status:"Neu"},base));
    }
  }catch(e){console.error(e)}
  finally{ensuring=false;pendingRegName=null}
}

let meUnsub=null;
onAuthStateChanged(auth,user=>{
  if(meUnsub){meUnsub();meUnsub=null}
  if(listsUnsub){listsUnsub();listsUnsub=null}
  COLLS.forEach(k=>{if(subs[k]){subs[k]();subs[k]=null}data[k]=[];loaded[k]=false});
  closeForm();
  if(!user){
    uid=null;me=null;meLoaded=false;
    $("#appScreen").hidden=true;$("#authScreen").hidden=false;
    $("#aPass").value="";$("#aPass2").value="";
    return;
  }
  uid=user.uid;
  $("#authScreen").hidden=true;$("#appScreen").hidden=false;
  try{const s=localStorage.getItem("bl-tab");if(s&&ENT[s])tab=s}catch(e){}
  listsUnsub=onSnapshot(doc(db,"einstellungen","listen"),snap=>{
    const d=snap.exists()?snap.data():{};
    LISTS={};Object.keys(DEFAULT_LISTS).forEach(k=>{LISTS[k]=Array.isArray(d[k])&&d[k].length?d[k]:JSON.parse(JSON.stringify(DEFAULT_LISTS[k]))});
    render();
  },()=>{});
  meUnsub=onSnapshot(doc(db,"mitarbeiter",uid),{includeMetadataChanges:true},snap=>{
    me=snap.exists()?Object.assign({},snap.data(),{id:snap.id}):null;
    meLoaded=true;
    if(!me&&!snap.metadata.fromCache)ensureOwnDoc(user);
    $("#live").classList.toggle("on",!snap.metadata.fromCache);
    $("#liveText").textContent=snap.metadata.fromCache?"Offline":"Live";
    computePerms();
    /* erst abonnieren, wenn die eigene Akte wirklich auf dem Server liegt */
    if(!snap.metadata.hasPendingWrites)syncSubs();
    render();
  },()=>{$("#liveText").textContent="Getrennt"});
  render();
});
</script>
